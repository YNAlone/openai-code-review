name: Build and Run OpenAiCodeReview By Main Maven Jar

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      run_count:
        description: '测试执行次数（仅批量测试时生效）'
        required: true
        default: '10'
        type: string
      batch_test:
        description: '是否开启批量测试'
        required: true
        default: 'false'
        type: boolean

jobs:
  # 第一步：生成测试矩阵
  # - 普通 push/PR：生成 [1]，只跑一次
  # - 批量测试：生成 [1,2,...,run_count]，跑 run_count 次
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate test matrix
        id: set-matrix
        run: |
          BATCH="${{ github.event.inputs.batch_test }}"
          COUNT="${{ github.event.inputs.run_count }}"
          if [ "$BATCH" = "true" ]; then
            JSON="["
            for i in $(seq 1 $COUNT); do
              if [ $i -gt 1 ]; then JSON="$JSON,"; fi
              JSON="$JSON$i"
            done
            JSON="$JSON]"
          else
            JSON="[1]"
          fi
          echo "matrix=$JSON" >> $GITHUB_OUTPUT
          echo "Generated matrix: $JSON"

  build:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # max-parallel 设为 1：批量测试时每次只跑一个 job，
      # 避免多个 job 同时 git push 产生冲突
      max-parallel: 1
      matrix:
        run: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          token: ${{ secrets.CODE_TOKEN }}

      # 批量测试时：模拟代码变更并推送，模拟真实 CI/CD 流程
      - name: 模拟代码变更（批量测试专用）
        if: ${{ github.event.inputs.batch_test == 'true' }}
        run: |
          echo "// 批量测试第${{ matrix.run }}次提交 $(date)" >> README.md
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add README.md
          git commit -m "feat: 批量测试第${{ matrix.run }}次提交"
          git push origin master

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Create libs directory
        run: mkdir -p ./libs

      - name: Download openai-code-review-sdk JAR
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          retry_wait_seconds: 5
          command: |
            wget -O ./libs/openai-code-review-sdk-1.0.jar https://github.com/YNAlone/openai-code-review-log/releases/download/v1.0.0/openai-code-review-sdk-1.0.jar

      - name: Get commit information
        run: |
          echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV
          echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
          echo "COMMIT_ID=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "COMMIT_AUTHOR=$(git log -1 --pretty=format:'%an <%ae>')" >> $GITHUB_ENV
          echo "COMMIT_MESSAGE=$(git log -1 --pretty=format:'%s')" >> $GITHUB_ENV

      - name: Print debug information
        run: |
          echo "仓库名: ${{ env.REPO_NAME }}"
          echo "分支名: ${{ env.BRANCH_NAME }}"
          echo "提交ID: ${{ env.COMMIT_ID }}"
          echo "提交作者: ${{ env.COMMIT_AUTHOR }}"
          echo "提交信息: ${{ env.COMMIT_MESSAGE }}"

      - name: Run Code Review
        run: java -jar ./libs/openai-code-review-sdk-1.0.jar
        env:
          GITHUB_REVIEW_LOG_URI: ${{ secrets.CODE_REVIEW_LOG_URI }}
          GITHUB_TOKEN: ${{ secrets.CODE_TOKEN }}
          COMMIT_PROJECT: ${{ env.REPO_NAME }}
          COMMIT_BRANCH: ${{ env.BRANCH_NAME }}
          COMMIT_ID: ${{ env.COMMIT_ID }}
          COMMIT_AUTHOR: ${{ env.COMMIT_AUTHOR }}
          COMMIT_MESSAGE: ${{ env.COMMIT_MESSAGE }}
          WEIXIN_APPID: ${{ secrets.WEIXIN_APPID }}
          WEIXIN_SECRET: ${{ secrets.WEIXIN_SECRET }}
          WEIXIN_TOUSER: ${{ secrets.WEIXIN_TOUSER }}
          WEIXIN_TEMPLATE_ID: ${{ secrets.WEIXIN_TEMPLATE_ID }}
          CHATGLM_APIHOST: ${{ secrets.CHATGLM_APIHOST }}
          CHATGLM_APIKEYSECRET: ${{ secrets.CHATGLM_APIKEYSECRET }}
