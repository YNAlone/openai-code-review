name: Code Guard 批量稳定性测试

# 仅支持手动触发，不会影响正常的代码提交流程
on:
  workflow_dispatch:
    inputs:
      run_count:
        description: '测试执行次数'
        required: true
        default: '10'
        type: string
      max_parallel:
        description: '最大并行数（免费版建议不超过10）'
        required: true
        default: '10'
        type: string

jobs:
  # 准备阶段：创建临时测试分支
  prepare:
    runs-on: ubuntu-latest
    outputs:
      test_branch: ${{ steps.create-branch.outputs.test_branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CODE_TOKEN }}

      - name: Create test branch
        id: create-branch
        run: |
          TEST_BRANCH="batch-test-$(date +%Y%m%d%H%M%S)"
          git checkout -b $TEST_BRANCH
          git push origin $TEST_BRANCH
          echo "test_branch=$TEST_BRANCH" >> $GITHUB_OUTPUT
          echo "创建临时测试分支: $TEST_BRANCH"

  # 批量执行阶段：并行运行指定次数的测试
  batch-run:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false # 一个失败不影响其他测试
      max-parallel: ${{ github.event.inputs.max_parallel }}
      matrix:
        run: ${{ fromJson(github.event.inputs.run_count) }}
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.test_branch }}
          fetch-depth: 0
          token: ${{ secrets.CODE_TOKEN }}

      - name: 模拟真实代码变更
        run: |
          # 自动修改测试文件，模拟开发者提交代码
          echo "// 批量测试第${{ matrix.run }}次提交 $(date)" >> src/test/java/CodeReviewTest.java
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add src/test/java/CodeReviewTest.java
          git commit -m "feat: 批量测试第${{ matrix.run }}次提交"
          git push origin ${{ needs.prepare.outputs.test_branch }}

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Download Code Guard SDK
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          retry_wait_seconds: 5
          command: |
            mkdir -p ./libs
            wget -O ./libs/openai-code-review-sdk-1.0.jar \
            https://github.com/YNAlone/openai-code-review-log/releases/download/v1.0.0/openai-code-review-sdk-1.0.jar

      - name: Get commit information
        run: |
          echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV
          echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
          echo "COMMIT_ID=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "COMMIT_AUTHOR=$(git log -1 --pretty=format:'%an <%ae>')" >> $GITHUB_ENV
          echo "COMMIT_MESSAGE=$(git log -1 --pretty=format:'%s')" >> $GITHUB_ENV

      - name: Run Code Guard Agent
        id: code-review
        run: |
          # 记录开始时间
          START_TIME=$(date +%s)
          java -jar ./libs/openai-code-review-sdk-1.0.jar
          # 计算执行耗时
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "duration=$DURATION" >> $GITHUB_OUTPUT
          echo "本次执行耗时: $DURATION 秒"
        env:
          GITHUB_REVIEW_LOG_URI: ${{ secrets.CODE_REVIEW_LOG_URI }}
          GITHUB_TOKEN: ${{ secrets.CODE_TOKEN }}
          COMMIT_PROJECT: ${{ env.REPO_NAME }}
          COMMIT_BRANCH: ${{ env.BRANCH_NAME }}
          COMMIT_ID: ${{ env.COMMIT_ID }}
          COMMIT_AUTHOR: ${{ env.COMMIT_AUTHOR }}
          COMMIT_MESSAGE: ${{ env.COMMIT_MESSAGE }}
          WEIXIN_APPID: ${{ secrets.WEIXIN_APPID }}
          WEIXIN_SECRET: ${{ secrets.WEIXIN_SECRET }}
          WEIXIN_TOUSER: ${{ secrets.WEIXIN_TOUSER }}
          WEIXIN_TEMPLATE_ID: ${{ secrets.WEIXIN_TEMPLATE_ID }}
          CHATGLM_APIHOST: ${{ secrets.CHATGLM_APIHOST }}
          CHATGLM_APIKEYSECRET: ${{ secrets.CHATGLM_APIKEYSECRET }}

    # 输出每个测试的耗时，用于最终统计
    outputs:
      duration_${{ matrix.run }}: ${{ steps.code-review.outputs.duration }}

  # 结果统计阶段：自动计算成功率和平均耗时
  report:
    needs: [prepare, batch-run]
    runs-on: ubuntu-latest
    steps:
      - name: 生成测试报告
        run: |
          echo "## Code Guard 批量稳定性测试报告" >> report.md
          echo "" >> report.md
          echo "测试时间: $(date '+%Y-%m-%d %H:%M:%S')" >> report.md
          echo "总执行次数: ${{ github.event.inputs.run_count }}" >> report.md
          echo "最大并行数: ${{ github.event.inputs.max_parallel }}" >> report.md
          echo "" >> report.md
          
          # 统计成功和失败次数
          SUCCESS_COUNT=0
          TOTAL_DURATION=0
          
          # 遍历所有运行结果
          for i in $(seq 1 ${{ github.event.inputs.run_count }}); do
            DURATION_VAR="duration_$i"
            DURATION="${{ needs.batch-run.outputs[$DURATION_VAR] }}"
          
            if [ -n "$DURATION" ] && [ "$DURATION" -gt 0 ]; then
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
              TOTAL_DURATION=$((TOTAL_DURATION + DURATION))
              echo "✅ 第$i次测试成功，耗时: $DURATION 秒" >> report.md
            else
              echo "❌ 第$i次测试失败" >> report.md
            fi
          done
          
          # 计算成功率和平均耗时
          SUCCESS_RATE=$(echo "scale=2; $SUCCESS_COUNT / ${{ github.event.inputs.run_count }} * 100" | bc)
          AVG_DURATION=$(echo "scale=2; $TOTAL_DURATION / $SUCCESS_COUNT" | bc)
          
          echo "" >> report.md
          echo "### 测试结果统计" >> report.md
          echo "- 成功次数: $SUCCESS_COUNT" >> report.md
          echo "- 失败次数: $(( ${{ github.event.inputs.run_count }} - $SUCCESS_COUNT ))" >> report.md
          echo "- 成功率: $SUCCESS_RATE%" >> report.md
          echo "- 平均执行耗时: $AVG_DURATION 秒" >> report.md
          
          # 打印报告到控制台
          cat report.md

      - name: 清理临时测试分支
        if: always()
        run: |
          git push origin --delete ${{ needs.prepare.outputs.test_branch }}
          echo "删除临时测试分支: ${{ needs.prepare.outputs.test_branch }}"